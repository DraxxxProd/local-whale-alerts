name: Large on-chain transfers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview alerts in logs without sending to Discord"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: whale-alerts-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      GITHUB_TOKEN: ${{ github.token }}
      STABLE_MIN_USD: "100000000"
      ETH_MIN_USD: "25000000"
      # Empty means all discovered and accessible EVM Transfers API mainnets.
      NETWORKS: ""
      MAX_RUN_SECONDS: "1000"
      MAX_RPC_CALLS: "2500"
      MONITOR_DATA_DIR: .whale-data
      MONITOR_DRY_RUN: ${{ inputs.dry_run }}
      # Optional if CoinGecko refuses anonymous API access:
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache public token and network registry
        uses: actions/cache@v4
        with:
          path: .whale-data/catalog.json
          key: whale-catalog-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: whale-catalog-v1-

      - name: Restore durable checkpoint
        id: restore
        run: python -u whale_alerts.py --restore-state

      - name: Scan and send
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            python -u whale_alerts.py --dry-run
          else
            python -u whale_alerts.py
          fi

      - name: Save checkpoint even after a partial scan
        if: always() && steps.restore.outcome == 'success' && inputs.dry_run != true
        run: python -u whale_alerts.py --save-state

      - name: Upload actual coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whale-coverage-${{ github.run_id }}
          path: .whale-data/coverage.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3
